<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Marked parses standard Markdown; DOMPurify sanitizes the generated HTML. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --ui-bg: #ffffff;
            --border: #eeeeee;
            --sidebar-width: 280px;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #d1d1d1;
            --ui-bg: #1a1a1a;
            --border: #2c2c2c;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            transition: background 0.3s;
        }

        /* 极简上传页 */
        #upload-page {
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .upload-box {
            width: 280px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        /* 阅读界面布局 */
        #reader-page { display: none; }

        .nav-bar {
            position: fixed; top: 0; width: 100%; height: 50px;
            background: var(--ui-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; z-index: 1000;
        }

        /* 侧边栏目录 */
        #sidebar {
            position: fixed; left: 0; top: 50px; bottom: 0; width: var(--sidebar-width);
            background: var(--ui-bg); border-right: 1px solid var(--border);
            overflow-y: auto; display: none; padding: 20px; z-index: 999;
        }

        .toc-link {
            display: block; padding: 12px 0; border-bottom: 1px solid var(--border);
            cursor: pointer; text-decoration: none; color: var(--text); font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toc-link:hover { color: #007aff; }

        /* 内容正文区 */
        #content-area {
            max-width: 750px; margin: 80px auto; padding: 0 20px 100px 20px;
            font-size: 18px;
        }

        /* 正文与 Markdown 排版 */
        :root { --code-bg: #f5f5f5; --quote-border: #d0d0d0; }
        [data-theme="dark"] { --code-bg: #202020; --quote-border: #555555; }

        #content-area img {
            max-width: 100%; height: auto; display: block; margin: 20px auto;
        }
        #content-area h1, #content-area h2, #content-area h3,
        #content-area h4, #content-area h5, #content-area h6 {
            line-height: 1.4; margin: 1.7em 0 .7em; scroll-margin-top: 70px;
        }
        #content-area h1, #content-area h2 { padding-bottom: .25em; border-bottom: 1px solid var(--border); }
        #content-area p, #content-area ul, #content-area ol { margin: .9em 0; }
        #content-area a { color: #1683d8; overflow-wrap: anywhere; }
        #content-area blockquote { margin: 1.2em 0; padding: .1em 1em; border-left: 4px solid var(--quote-border); opacity: .9; }
        #content-area pre {
            padding: 14px 16px; overflow: auto; background: var(--code-bg);
            border: 1px solid var(--border); border-radius: 6px; line-height: 1.55;
        }
        #content-area code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
        #content-area :not(pre) > code { background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
        #content-area table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
        #content-area th, #content-area td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        #content-area th { background: var(--code-bg); }
        #content-area hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
        #content-area input[type="checkbox"] { margin-right: .45em; }
        #content-area .plain-text { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0; }
        .toc-link.toc-level-2 { padding-left: 12px; }
        .toc-link.toc-level-3 { padding-left: 24px; }
        .toc-empty { opacity: .6; font-size: 13px; }

        /* 按钮样式 */
        .btn {
            padding: 6px 14px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); cursor: pointer;
            margin-right: 10px; border-radius: 4px; font-size: 13px;
        }
        .btn:hover { background: var(--border); }

        /* 适配：内容中的 ID 跳转目标增加偏移，防止被顶部导航拦挡住 */
        section[id], div[id], p[id], span[id] {
            scroll-margin-top: 70px;
        }
    </style>
</head>
<body>

    <div id="upload-page">
        <div class="upload-box">
            <input type="file" id="file-input" accept=".epub,.md,.markdown,.txt,text/markdown,text/plain">
            <p style="font-size: 12px; opacity: .65; margin: 16px 0 0;">支持 EPUB、Markdown（.md）和纯文本（.txt）</p>
        </div>
    </div>

    <div id="reader-page">
        <div class="nav-bar">
            <button class="btn" onclick="toggleTOC()">☰ 目录</button>
            <button class="btn" onclick="toggleTheme()">🌓 模式</button>
            <button class="btn" onclick="location.href=location.pathname">退出</button>
            <span id="book-title" style="font-size: 14px; opacity: 0.6; margin-left: 10px;"></span>
        </div>
        
        <div id="sidebar">
            <h3 style="font-size: 16px;">目录</h3>
            <div id="toc-list"></div>
        </div>

        <article id="content-area"></article>
    </div>

    <script>
        let blobs = {};
        let currentFormat = '';

        const fileInput = document.getElementById('file-input');
        const uploadPage = document.getElementById('upload-page');
        const readerPage = document.getElementById('reader-page');
        const contentArea = document.getElementById('content-area');
        const tocList = document.getElementById('toc-list');
        const sidebar = document.getElementById('sidebar');

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            resetReader();
            try {
                const extension = file.name.split('.').pop().toLowerCase();
                if (extension === 'epub') {
                    await loadEpub(file);
                } else if (['md', 'markdown'].includes(extension)) {
                    await loadTextDocument(file, 'markdown');
                } else if (extension === 'txt') {
                    await loadTextDocument(file, 'text');
                } else {
                    throw new Error('暂不支持这种文件格式。请选择 EPUB、MD、MARKDOWN 或 TXT 文件。');
                }
            } catch (error) {
                console.error(error);
                resetReader();
                alert('读取文件失败：' + (error && error.message ? error.message : '请检查文件格式后重试。'));
            }
        });

        function resetReader() {
            // 释放上一次 EPUB 创建的临时资源地址，避免连续打开书籍时累积占用。
            Object.values(blobs).forEach((url) => URL.revokeObjectURL(url));
            blobs = {};
            currentFormat = '';
            contentArea.innerHTML = '';
            tocList.innerHTML = '';
            sidebar.style.display = 'none';
            readerPage.style.display = 'none';
            uploadPage.style.display = 'flex';
        }

        function startReader(title, format) {
            currentFormat = format;
            uploadPage.style.display = 'none';
            readerPage.style.display = 'block';
            document.getElementById('book-title').innerText = title;
            document.title = title;

            // 保留书名参数，方便依赖 URL 的阅读辅助脚本区分不同文档。
            try {
                const safeTitle = title.trim().replace(/\s+/g, '_');
                const url = new URL(window.location.href);
                url.searchParams.set('book', safeTitle);
                window.history.pushState({ book: safeTitle }, '', url.toString());
                window.dispatchEvent(new PopStateEvent('popstate'));
            } catch (error) {
                // 某些 file:// 环境不允许修改历史记录；这不影响阅读。
                console.debug('当前环境不支持修改浏览器历史记录。', error);
            }
        }

        async function loadTextDocument(file, format) {
            const text = await file.text();
            const title = file.name.replace(/\.(md|markdown|txt)$/i, '') || file.name;
            startReader(title, format);

            if (format === 'text') {
                const pre = document.createElement('pre');
                pre.className = 'plain-text';
                pre.textContent = text;
                contentArea.appendChild(pre);
                showEmptyTOC('纯文本没有自动生成的标题目录。');
                return;
            }

            if (!window.marked || !window.DOMPurify) {
                throw new Error('Markdown 解析组件加载失败。请检查网络连接后刷新页面再试。');
            }

            // GFM 支持表格、删除线和任务列表；默认保留 Markdown 的普通换行规则。
            const renderedHTML = window.marked.parse(text, { gfm: true, breaks: false });
            contentArea.innerHTML = window.DOMPurify.sanitize(renderedHTML, {
                USE_PROFILES: { html: true }
            });

            addHeadingIds(contentArea);
            buildHeadingTOC(contentArea);
        }

        async function loadEpub(file) {
            if (!window.JSZip) {
                throw new Error('EPUB 解压组件加载失败。请检查网络连接后刷新页面再试。');
            }

            const zip = await JSZip.loadAsync(file);
            // 先缓存 EPUB 内资源为 Blob URL，供章节里的图片等资源引用。
            for (const filename in zip.files) {
                const fileData = zip.files[filename];
                if (!fileData.dir) {
                    const content = await fileData.async('blob');
                    blobs[filename] = URL.createObjectURL(content);
                }
            }

            const opfPath = await findOPF(zip);
            const opfFile = zip.file(opfPath);
            if (!opfFile) throw new Error('EPUB 目录结构不完整，找不到 OPF 文件。');

            const baseDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
            const opfText = await opfFile.async('text');
            const opfDoc = new DOMParser().parseFromString(opfText, 'text/xml');
            if (opfDoc.querySelector('parsererror')) throw new Error('EPUB 的 OPF 文件无法解析。');

            const title = opfDoc.getElementsByTagName('dc:title')[0]?.textContent?.trim() || file.name.replace(/\.epub$/i, '');
            startReader(title, 'epub');

            const manifestMap = {};
            Array.from(opfDoc.getElementsByTagName('item')).forEach((item) => {
                manifestMap[item.getAttribute('id')] = item.getAttribute('href');
            });

            const itemrefs = Array.from(opfDoc.getElementsByTagName('itemref'));
            for (const ref of itemrefs) {
                const href = manifestMap[ref.getAttribute('idref')];
                if (!href) continue;
                const fullPath = normalizePath(baseDir + href.split('#')[0]);
                const chapterFile = zip.file(fullPath);
                if (!chapterFile) continue;

                const htmlText = await chapterFile.async('text');
                const section = document.createElement('section');
                section.id = href;
                section.innerHTML = processHTML(htmlText, fullPath.substring(0, fullPath.lastIndexOf('/') + 1));
                contentArea.appendChild(section);

                const firstHeading = section.querySelector('h1, h2, h3');
                addTOCLink(firstHeading ? firstHeading.innerText.trim() : href, () => {
                    section.scrollIntoView({ behavior: 'smooth' });
                    sidebar.style.display = 'none';
                });
            }
            if (!tocList.children.length) showEmptyTOC('没有找到可用的章节目录。');
        }

        function processHTML(html, baseDir) {
            const doc = new DOMParser().parseFromString(html, 'text/html');

            doc.querySelectorAll('img, image').forEach((img) => {
                const attr = img.tagName.toLowerCase() === 'img' ? 'src' : 'xlink:href';
                const src = img.getAttribute(attr);
                if (src) {
                    const fullPath = normalizePath(baseDir + src.split('#')[0]);
                    if (blobs[fullPath]) img.setAttribute(attr, blobs[fullPath]);
                }
            });

            // 与原版一致，避免 EPUB 自带的样式表覆盖阅读器主题。
            doc.querySelectorAll('link[rel="stylesheet"], style').forEach((element) => element.remove());
            return doc.body.innerHTML;
        }

        function normalizePath(path) {
            const parts = path.replace(/\\/g, '/').split('/');
            const stack = [];
            for (const part of parts) {
                if (part === '..') stack.pop();
                else if (part !== '.' && part !== '') stack.push(part);
            }
            return stack.join('/');
        }

        async function findOPF(zip) {
            const containerFile = zip.file('META-INF/container.xml');
            if (!containerFile) throw new Error('这不是标准的 EPUB 文件，缺少 META-INF/container.xml。');
            const container = await containerFile.async('text');
            const doc = new DOMParser().parseFromString(container, 'text/xml');
            const rootfile = doc.getElementsByTagName('rootfile')[0];
            if (!rootfile || !rootfile.getAttribute('full-path')) throw new Error('EPUB 中找不到书籍目录文件。');
            return rootfile.getAttribute('full-path');
        }

        function slugifyHeading(text) {
            return text.toLowerCase().trim().normalize('NFKC')
                .replace(/[^\p{L}\p{N}\s_-]/gu, '')
                .replace(/[\s_]+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '') || 'section';
        }

        function addHeadingIds(container) {
            const headings = Array.from(container.querySelectorAll('h1, h2, h3, h4, h5, h6'));
            const usedIds = new Set(
                Array.from(container.querySelectorAll('[id]'))
                    .filter((element) => !element.matches('h1, h2, h3, h4, h5, h6'))
                    .map((element) => element.id)
            );

            headings.forEach((heading) => {
                const base = heading.id || slugifyHeading(heading.textContent || '');
                let id = base;
                let suffix = 2;
                while (usedIds.has(id)) id = `${base}-${suffix++}`;
                heading.id = id;
                usedIds.add(id);
            });
        }

        function buildHeadingTOC(container) {
            const headings = Array.from(container.querySelectorAll('h1, h2, h3'));
            headings.forEach((heading) => {
                const link = document.createElement('a');
                link.className = 'toc-link ' + (heading.tagName.toLowerCase() === 'h2' ? 'toc-level-2' : heading.tagName.toLowerCase() === 'h3' ? 'toc-level-3' : '');
                link.href = '#' + encodeURIComponent(heading.id);
                link.textContent = heading.textContent.trim() || '无标题';
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                    sidebar.style.display = 'none';
                });
                tocList.appendChild(link);
            });
            if (!tocList.children.length) showEmptyTOC('没有找到 Markdown 标题。');
        }

        function addTOCLink(label, onClick) {
            const link = document.createElement('a');
            link.className = 'toc-link';
            link.href = '#';
            link.textContent = label || '未命名章节';
            link.addEventListener('click', (event) => {
                event.preventDefault();
                onClick();
            });
            tocList.appendChild(link);
        }

        function showEmptyTOC(message) {
            const hint = document.createElement('p');
            hint.className = 'toc-empty';
            hint.textContent = message;
            tocList.appendChild(hint);
        }

        // EPUB 的相对章节链接需要在当前文档内跳转；Markdown 锚点则走正常的页面内跳转。
        contentArea.addEventListener('click', (event) => {
            const anchor = event.target.closest('a');
            if (!anchor) return;
            const href = anchor.getAttribute('href');
            if (!href) return;

            if (href.startsWith('#')) {
                const rawId = href.slice(1);
                let id = rawId;
                try { id = decodeURIComponent(rawId); } catch (_) {}
                const target = document.getElementById(id);
                if (target) {
                    event.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                }
                return;
            }

            if (currentFormat !== 'epub' || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            event.preventDefault();
            const parts = href.split('#');
            const fileName = decodeURIComponent(parts[0] || '');
            const hash = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('#')) : '';
            let target = hash ? document.getElementById(hash) : null;
            if (!target && fileName) {
                target = document.getElementById(fileName) ||
                    Array.from(contentArea.querySelectorAll('section[id]')).find((section) => section.id.endsWith(fileName));
            }
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        });

        function toggleTOC() {
            sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
