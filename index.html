<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Marked parses standard Markdown; DOMPurify sanitizes the generated HTML. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.12.3/dist/mermaid.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
            startup: { typeset: false }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --ui-bg: #ffffff;
            --border: #eeeeee;
            --sidebar-width: 280px;
            --strong-color: #bd5239;
            --em-color: #2c719c;
            --code-bg: #f5f5f5;
            --quote-border: #d0d0d0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #d1d1d1;
            --ui-bg: #1a1a1a;
            --border: #2c2c2c;
            --strong-color: #ff9f83;
            --em-color: #8bc9f5;
            --code-bg: #202020;
            --quote-border: #555555;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.8;
            transition: background 0.3s;
        }

        /* 极简上传页 */
        #upload-page {
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .upload-box {
            width: 280px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        /* 阅读界面布局 */
        #reader-page { display: none; }

        .nav-bar {
            position: fixed; top: 0; width: 100%; height: 50px;
            background: var(--ui-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; z-index: 1000;
        }

        /* 侧边栏目录 */
        #sidebar {
            position: fixed; left: 0; top: 50px; bottom: 0; width: var(--sidebar-width);
            background: var(--ui-bg); border-right: 1px solid var(--border);
            overflow-y: auto; display: none; padding: 20px; z-index: 999;
        }

        .toc-link {
            display: block; padding: 12px 0; border-bottom: 1px solid var(--border);
            cursor: pointer; text-decoration: none; color: var(--text); font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toc-link:hover { color: #007aff; }

        /* 内容正文区 */
        #content-area {
            max-width: var(--reader-max-width, 820px);
            margin: 80px auto;
            padding: 0 24px 100px;
            font-family: var(--latin-font, system-ui), sans-serif;
            font-size: var(--reader-font-size, 18px);
            line-height: var(--reader-line-height, 1.85);
            letter-spacing: var(--reader-letter-spacing, 0px);
            text-wrap: pretty;
            overflow-wrap: anywhere;
            word-break: normal;
            hyphens: auto;
            line-break: strict;
            hanging-punctuation: first last;
        }
        #content-area .cjk-run { font-family: var(--cjk-font, "PingFang SC", "Microsoft YaHei", sans-serif); }
        #content-area strong, #content-area b { color: var(--strong-color); }
        #content-area em, #content-area i { color: var(--em-color); }

        #content-area img {
            max-width: 100%; height: auto; display: block; margin: 20px auto;
        }
        #content-area h1, #content-area h2, #content-area h3,
        #content-area h4, #content-area h5, #content-area h6 {
            line-height: 1.4; margin: 1.7em 0 .7em; scroll-margin-top: 70px;
        }
        #content-area h1, #content-area h2 { padding-bottom: .25em; border-bottom: 1px solid var(--border); }
        #content-area p, #content-area ul, #content-area ol { margin: var(--paragraph-gap, .9em) 0; }
        #content-area li { padding-inline-start: .08em; }
        #content-area :lang(en) { hyphens: auto; }
        #content-area :lang(zh), #content-area :lang(zh-CN) { hyphens: manual; }
        #content-area a { color: #1683d8; overflow-wrap: anywhere; }
        #content-area blockquote { margin: 1.2em 0; padding: .1em 1em; border-left: 4px solid var(--quote-border); opacity: .9; }
        #content-area pre {
            padding: 14px 16px; overflow: auto; background: var(--code-bg);
            border: 1px solid var(--border); border-radius: 6px; line-height: 1.55;
        }
        #content-area code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
        #content-area :not(pre) > code { background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
        #content-area table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
        #content-area th, #content-area td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        #content-area th { background: var(--code-bg); }
        #content-area hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
        #content-area input[type="checkbox"] { margin-right: .45em; }
        #content-area .plain-text { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0; }
        #content-area .diagram-wrap { margin: 1.5em 0; max-width: 100%; overflow-x: auto; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--ui-bg); }
        #content-area pre.mermaid { white-space: pre; border: 0; background: transparent; margin: 0; }
        #content-area .diagram-wrap svg { max-width: 100%; height: auto; }
        #content-area .diagram-error { color: #c64747; font-size: 13px; margin-bottom: 8px; }
        #content-area .chart-container { position: relative; width: 100%; height: 360px; margin: 1.5em 0; padding: 12px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; background: var(--ui-bg); }
        #content-area .math-error { color: #c64747; font-size: 13px; }

        /* 阅读排版面板 */
        .settings-panel {
            position: fixed; top: 60px; right: 14px; z-index: 1100;
            width: min(340px, calc(100vw - 28px)); max-height: calc(100vh - 78px); overflow-y: auto;
            box-sizing: border-box; padding: 18px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--ui-bg); color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,.18);
        }
        .settings-panel[hidden] { display: none; }
        .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .settings-header h3 { font-size: 16px; margin: 0; }
        .settings-close { border: 0; background: transparent; color: inherit; font-size: 22px; cursor: pointer; }
        .setting-control { display: block; margin: 14px 0; font-size: 13px; }
        .setting-control .setting-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
        .setting-control output { opacity: .7; font-variant-numeric: tabular-nums; }
        .setting-control select, .setting-control input[type="range"] { width: 100%; box-sizing: border-box; }
        .setting-control select { padding: 7px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); }
        .setting-colors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .setting-colors input[type="color"] { width: 100%; height: 32px; padding: 2px; border: 1px solid var(--border); background: var(--bg); border-radius: 5px; }
        .settings-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
        .settings-note { opacity: .65; font-size: 11px; line-height: 1.5; }
        @media (max-width: 600px) {
            .nav-bar { padding: 0 8px; gap: 4px; }
            .nav-bar .btn { padding: 6px 8px; margin-right: 0; font-size: 12px; }
            #book-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #sidebar { width: min(280px, calc(100vw - 40px)); box-sizing: border-box; }
            #content-area { padding-inline: 16px; }
            #content-area .chart-container { height: 300px; }
        }
        .toc-link.toc-level-2 { padding-left: 12px; }
        .toc-link.toc-level-3 { padding-left: 24px; }
        .toc-empty { opacity: .6; font-size: 13px; }

        /* 按钮样式 */
        .btn {
            padding: 6px 14px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); cursor: pointer;
            margin-right: 10px; border-radius: 4px; font-size: 13px;
        }
        .btn:hover { background: var(--border); }

        /* 适配：内容中的 ID 跳转目标增加偏移，防止被顶部导航拦挡住 */
        section[id], div[id], p[id], span[id] {
            scroll-margin-top: 70px;
        }
    </style>
</head>
<body>

    <div id="upload-page">
        <div class="upload-box">
            <input type="file" id="file-input" accept=".epub,.md,.markdown,.txt,text/markdown,text/plain">
            <p style="font-size: 12px; opacity: .65; line-height: 1.7; margin: 16px 0 0;">支持 EPUB、Markdown（.md）和纯文本（.txt）</p>
            <p style="font-size: 11px; opacity: .6; line-height: 1.7; margin: 8px 0 0;">Markdown 还支持 Mermaid 图表（含鱼骨图）、Chart.js 数据图和 LaTeX 数学公式。首次使用需要网络连接。</p>
        </div>
    </div>

    <div id="reader-page">
        <div class="nav-bar">
            <button class="btn" onclick="toggleTOC()">☰ 目录</button>
            <button class="btn" onclick="toggleTheme()">🌓 模式</button>
            <button class="btn" onclick="toggleSettings()">Aa 排版</button>
            <button class="btn" onclick="location.href=location.pathname">退出</button>
            <span id="book-title" style="font-size: 14px; opacity: 0.6; margin-left: 10px;"></span>
        </div>
        
        <div id="sidebar">
            <h3 style="font-size: 16px;">目录</h3>
            <div id="toc-list"></div>
        </div>

        <article id="content-area"></article>
        <aside id="settings-panel" class="settings-panel" hidden aria-label="阅读排版设置">
            <div class="settings-header">
                <h3>阅读排版</h3>
                <button class="settings-close" type="button" aria-label="关闭排版设置" onclick="toggleSettings(false)">×</button>
            </div>
            <label class="setting-control">
                <span class="setting-top">中文字体</span>
                <select id="setting-cjk-font">
                    <option value="'PingFang SC', 'Microsoft YaHei', sans-serif">系统黑体（推荐）</option>
                    <option value="'Songti SC', 'SimSun', serif">宋体 / 明朝体</option>
                    <option value="'Microsoft YaHei', 'PingFang SC', sans-serif">微软雅黑优先</option>
                    <option value="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif">思源黑体 / Noto Sans CJK</option>
                    <option value="'Noto Serif CJK SC', 'Source Han Serif SC', serif">思源宋体 / Noto Serif CJK</option>
                    <option value="serif">浏览器默认衬线体</option>
                    <option value="sans-serif">浏览器默认无衬线体</option>
                </select>
            </label>
            <label class="setting-control">
                <span class="setting-top">英文字体</span>
                <select id="setting-latin-font">
                    <option value="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">系统默认（推荐）</option>
                    <option value="Arial, Helvetica, sans-serif">Arial</option>
                    <option value="Georgia, 'Times New Roman', serif">Georgia（衬线）</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                    <option value="Verdana, Geneva, sans-serif">Verdana</option>
                    <option value="'Atkinson Hyperlegible', Arial, sans-serif">Atkinson Hyperlegible</option>
                </select>
            </label>
            <label class="setting-control">
                <span class="setting-top"><span>字号</span><output id="setting-font-size-value">18 px</output></span>
                <input id="setting-font-size" type="range" min="14" max="30" step="1" value="18">
            </label>
            <label class="setting-control">
                <span class="setting-top"><span>行间距</span><output id="setting-line-height-value">1.85</output></span>
                <input id="setting-line-height" type="range" min="1.3" max="2.5" step="0.05" value="1.85">
            </label>
            <label class="setting-control">
                <span class="setting-top"><span>字距</span><output id="setting-letter-spacing-value">0 px</output></span>
                <input id="setting-letter-spacing" type="range" min="-0.5" max="2" step="0.1" value="0">
            </label>
            <label class="setting-control">
                <span class="setting-top"><span>正文宽度</span><output id="setting-content-width-value">820 px</output></span>
                <input id="setting-content-width" type="range" min="560" max="1100" step="20" value="820">
            </label>
            <label class="setting-control">
                <span class="setting-top"><span>段落间距</span><output id="setting-paragraph-gap-value">0.9 em</output></span>
                <input id="setting-paragraph-gap" type="range" min="0.3" max="2" step="0.1" value="0.9">
            </label>
            <div class="setting-colors">
                <label class="setting-control">粗体强调色<input id="setting-strong-color" type="color" value="#bd5239"></label>
                <label class="setting-control">斜体强调色<input id="setting-em-color" type="color" value="#2c719c"></label>
            </div>
            <div class="settings-actions">
                <button class="btn" type="button" onclick="resetReaderSettings()">恢复默认</button>
                <button class="btn" type="button" onclick="toggleSettings(false)">完成</button>
            </div>
            <p class="settings-note">设置会保存在当前浏览器中。字体选项取决于设备是否安装；未安装的字体会自动回退。</p>
        </aside>
    </div>

    <script>
        let blobs = {};
        let currentFormat = '';
        let chartInstances = [];
        const defaultSettings = {
            cjkFont: "'PingFang SC', 'Microsoft YaHei', sans-serif",
            latinFont: 'system-ui, -apple-system, BlinkMacSystemFont, sans-serif',
            fontSize: '18', lineHeight: '1.85', letterSpacing: '0', contentWidth: '820', paragraphGap: '0.9'
        };

        const fileInput = document.getElementById('file-input');
        const uploadPage = document.getElementById('upload-page');
        const readerPage = document.getElementById('reader-page');
        const contentArea = document.getElementById('content-area');
        const tocList = document.getElementById('toc-list');
        const sidebar = document.getElementById('sidebar');
        const settingsPanel = document.getElementById('settings-panel');

        initializeReaderSettings();
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !settingsPanel.hidden) toggleSettings(false);
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            resetReader();
            try {
                const extension = file.name.split('.').pop().toLowerCase();
                if (extension === 'epub') {
                    await loadEpub(file);
                } else if (['md', 'markdown'].includes(extension)) {
                    await loadTextDocument(file, 'markdown');
                } else if (extension === 'txt') {
                    await loadTextDocument(file, 'text');
                } else {
                    throw new Error('暂不支持这种文件格式。请选择 EPUB、MD、MARKDOWN 或 TXT 文件。');
                }
            } catch (error) {
                console.error(error);
                resetReader();
                alert('读取文件失败：' + (error && error.message ? error.message : '请检查文件格式后重试。'));
            }
        });

        function resetReader() {
            // 释放上一次 EPUB 创建的临时资源地址，避免连续打开书籍时累积占用。
            Object.values(blobs).forEach((url) => URL.revokeObjectURL(url));
            blobs = {};
            chartInstances.forEach((chart) => { try { chart.destroy(); } catch (_) {} });
            chartInstances = [];
            currentFormat = '';
            contentArea.innerHTML = '';
            tocList.innerHTML = '';
            sidebar.style.display = 'none';
            settingsPanel.hidden = true;
            readerPage.style.display = 'none';
            uploadPage.style.display = 'flex';
        }

        function startReader(title, format) {
            currentFormat = format;
            uploadPage.style.display = 'none';
            readerPage.style.display = 'block';
            document.getElementById('book-title').innerText = title;
            document.title = title;

            // 保留书名参数，方便依赖 URL 的阅读辅助脚本区分不同文档。
            try {
                const safeTitle = title.trim().replace(/\s+/g, '_');
                const url = new URL(window.location.href);
                url.searchParams.set('book', safeTitle);
                window.history.pushState({ book: safeTitle }, '', url.toString());
                window.dispatchEvent(new PopStateEvent('popstate'));
            } catch (error) {
                // 某些 file:// 环境不允许修改历史记录；这不影响阅读。
                console.debug('当前环境不支持修改浏览器历史记录。', error);
            }
        }

        async function loadTextDocument(file, format) {
            const text = await file.text();
            const title = file.name.replace(/\.(md|markdown|txt)$/i, '') || file.name;
            startReader(title, format);

            if (format === 'text') {
                const pre = document.createElement('pre');
                pre.className = 'plain-text';
                pre.textContent = text;
                contentArea.appendChild(pre);
                showEmptyTOC('纯文本没有自动生成的标题目录。');
                return;
            }

            if (!window.marked || !window.DOMPurify) {
                throw new Error('Markdown 解析组件加载失败。请检查网络连接后刷新页面再试。');
            }

            // GFM 支持表格、删除线和任务列表；默认保留 Markdown 的普通换行规则。
            const renderedHTML = window.marked.parse(text, { gfm: true, breaks: false });
            contentArea.innerHTML = window.DOMPurify.sanitize(renderedHTML, {
                USE_PROFILES: { html: true }
            });

            addHeadingIds(contentArea);
            buildHeadingTOC(contentArea);
            await enhanceMarkdownContent(contentArea);
            applyLanguageFonts(contentArea);
        }

        async function loadEpub(file) {
            if (!window.JSZip) {
                throw new Error('EPUB 解压组件加载失败。请检查网络连接后刷新页面再试。');
            }

            const zip = await JSZip.loadAsync(file);
            // 先缓存 EPUB 内资源为 Blob URL，供章节里的图片等资源引用。
            for (const filename in zip.files) {
                const fileData = zip.files[filename];
                if (!fileData.dir) {
                    const content = await fileData.async('blob');
                    blobs[filename] = URL.createObjectURL(content);
                }
            }

            const opfPath = await findOPF(zip);
            const opfFile = zip.file(opfPath);
            if (!opfFile) throw new Error('EPUB 目录结构不完整，找不到 OPF 文件。');

            const baseDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
            const opfText = await opfFile.async('text');
            const opfDoc = new DOMParser().parseFromString(opfText, 'text/xml');
            if (opfDoc.querySelector('parsererror')) throw new Error('EPUB 的 OPF 文件无法解析。');

            const title = opfDoc.getElementsByTagName('dc:title')[0]?.textContent?.trim() || file.name.replace(/\.epub$/i, '');
            startReader(title, 'epub');

            const manifestMap = {};
            Array.from(opfDoc.getElementsByTagName('item')).forEach((item) => {
                manifestMap[item.getAttribute('id')] = item.getAttribute('href');
            });

            const itemrefs = Array.from(opfDoc.getElementsByTagName('itemref'));
            for (const ref of itemrefs) {
                const href = manifestMap[ref.getAttribute('idref')];
                if (!href) continue;
                const fullPath = normalizePath(baseDir + href.split('#')[0]);
                const chapterFile = zip.file(fullPath);
                if (!chapterFile) continue;

                const htmlText = await chapterFile.async('text');
                const section = document.createElement('section');
                section.id = href;
                section.innerHTML = processHTML(htmlText, fullPath.substring(0, fullPath.lastIndexOf('/') + 1));
                contentArea.appendChild(section);

                const firstHeading = section.querySelector('h1, h2, h3');
                addTOCLink(firstHeading ? firstHeading.innerText.trim() : href, () => {
                    section.scrollIntoView({ behavior: 'smooth' });
                    sidebar.style.display = 'none';
                });
            }
            if (!tocList.children.length) showEmptyTOC('没有找到可用的章节目录。');
            applyLanguageFonts(contentArea);
        }

        function processHTML(html, baseDir) {
            const doc = new DOMParser().parseFromString(html, 'text/html');

            doc.querySelectorAll('img, image').forEach((img) => {
                const attr = img.tagName.toLowerCase() === 'img' ? 'src' : 'xlink:href';
                const src = img.getAttribute(attr);
                if (src) {
                    const fullPath = normalizePath(baseDir + src.split('#')[0]);
                    if (blobs[fullPath]) img.setAttribute(attr, blobs[fullPath]);
                }
            });

            // 与原版一致，避免 EPUB 自带的样式表覆盖阅读器主题。
            doc.querySelectorAll('link[rel="stylesheet"], style').forEach((element) => element.remove());
            return doc.body.innerHTML;
        }

        function normalizePath(path) {
            const parts = path.replace(/\\/g, '/').split('/');
            const stack = [];
            for (const part of parts) {
                if (part === '..') stack.pop();
                else if (part !== '.' && part !== '') stack.push(part);
            }
            return stack.join('/');
        }

        async function findOPF(zip) {
            const containerFile = zip.file('META-INF/container.xml');
            if (!containerFile) throw new Error('这不是标准的 EPUB 文件，缺少 META-INF/container.xml。');
            const container = await containerFile.async('text');
            const doc = new DOMParser().parseFromString(container, 'text/xml');
            const rootfile = doc.getElementsByTagName('rootfile')[0];
            if (!rootfile || !rootfile.getAttribute('full-path')) throw new Error('EPUB 中找不到书籍目录文件。');
            return rootfile.getAttribute('full-path');
        }

        function slugifyHeading(text) {
            return text.toLowerCase().trim().normalize('NFKC')
                .replace(/[^\p{L}\p{N}\s_-]/gu, '')
                .replace(/[\s_]+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '') || 'section';
        }

        function addHeadingIds(container) {
            const headings = Array.from(container.querySelectorAll('h1, h2, h3, h4, h5, h6'));
            const usedIds = new Set(
                Array.from(container.querySelectorAll('[id]'))
                    .filter((element) => !element.matches('h1, h2, h3, h4, h5, h6'))
                    .map((element) => element.id)
            );

            headings.forEach((heading) => {
                const base = heading.id || slugifyHeading(heading.textContent || '');
                let id = base;
                let suffix = 2;
                while (usedIds.has(id)) id = `${base}-${suffix++}`;
                heading.id = id;
                usedIds.add(id);
            });
        }

        function buildHeadingTOC(container) {
            const headings = Array.from(container.querySelectorAll('h1, h2, h3'));
            headings.forEach((heading) => {
                const link = document.createElement('a');
                link.className = 'toc-link ' + (heading.tagName.toLowerCase() === 'h2' ? 'toc-level-2' : heading.tagName.toLowerCase() === 'h3' ? 'toc-level-3' : '');
                link.href = '#' + encodeURIComponent(heading.id);
                link.textContent = heading.textContent.trim() || '无标题';
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                    sidebar.style.display = 'none';
                });
                tocList.appendChild(link);
            });
            if (!tocList.children.length) showEmptyTOC('没有找到 Markdown 标题。');
        }

        function addTOCLink(label, onClick) {
            const link = document.createElement('a');
            link.className = 'toc-link';
            link.href = '#';
            link.textContent = label || '未命名章节';
            link.addEventListener('click', (event) => {
                event.preventDefault();
                onClick();
            });
            tocList.appendChild(link);
        }

        function showEmptyTOC(message) {
            const hint = document.createElement('p');
            hint.className = 'toc-empty';
            hint.textContent = message;
            tocList.appendChild(hint);
        }

        // EPUB 的相对章节链接需要在当前文档内跳转；Markdown 锚点则走正常的页面内跳转。
        contentArea.addEventListener('click', (event) => {
            const anchor = event.target.closest('a');
            if (!anchor) return;
            const href = anchor.getAttribute('href');
            if (!href) return;

            if (href.startsWith('#')) {
                const rawId = href.slice(1);
                let id = rawId;
                try { id = decodeURIComponent(rawId); } catch (_) {}
                const target = document.getElementById(id);
                if (target) {
                    event.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                }
                return;
            }

            if (currentFormat !== 'epub' || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            event.preventDefault();
            const parts = href.split('#');
            const fileName = decodeURIComponent(parts[0] || '');
            const hash = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('#')) : '';
            let target = hash ? document.getElementById(hash) : null;
            if (!target && fileName) {
                target = document.getElementById(fileName) ||
                    Array.from(contentArea.querySelectorAll('section[id]')).find((section) => section.id.endsWith(fileName));
            }
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        });

        function toggleTOC() {
            sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            rerenderMermaidDiagrams(contentArea);
        }

        function toggleSettings(forceOpen) {
            const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : settingsPanel.hidden;
            settingsPanel.hidden = !shouldOpen;
        }

        function initializeReaderSettings() {
            const controls = {
                cjkFont: 'setting-cjk-font', latinFont: 'setting-latin-font', fontSize: 'setting-font-size',
                lineHeight: 'setting-line-height', letterSpacing: 'setting-letter-spacing',
                contentWidth: 'setting-content-width', paragraphGap: 'setting-paragraph-gap'
            };
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem('nativeReaderSettings') || '{}') || {}; } catch (_) {}
            Object.entries(controls).forEach(([key, id]) => {
                const el = document.getElementById(id);
                const value = saved[key] ?? defaultSettings[key];
                if (el && Array.from(el.options || []).some((option) => option.value === String(value)) || el && el.type === 'range') {
                    el.value = String(value);
                }
            });
            if (saved.strongColor) {
                const el = document.getElementById('setting-strong-color'); el.value = saved.strongColor; el.dataset.customized = 'true';
            }
            if (saved.emColor) {
                const el = document.getElementById('setting-em-color'); el.value = saved.emColor; el.dataset.customized = 'true';
            }
            settingsPanel.querySelectorAll('select, input').forEach((el) => {
                el.addEventListener('input', () => applyReaderSettings(true));
                el.addEventListener('change', () => applyReaderSettings(true));
                if (el.type === 'color') el.addEventListener('input', () => { el.dataset.customized = 'true'; applyReaderSettings(true); });
            });
            applyReaderSettings(false);
        }

        function applyReaderSettings(save) {
            const get = (id) => document.getElementById(id);
            const values = {
                cjkFont: get('setting-cjk-font').value,
                latinFont: get('setting-latin-font').value,
                fontSize: get('setting-font-size').value,
                lineHeight: get('setting-line-height').value,
                letterSpacing: get('setting-letter-spacing').value,
                contentWidth: get('setting-content-width').value,
                paragraphGap: get('setting-paragraph-gap').value
            };
            const area = contentArea;
            area.style.setProperty('--cjk-font', values.cjkFont);
            area.style.setProperty('--latin-font', values.latinFont);
            area.style.setProperty('--reader-font-size', values.fontSize + 'px');
            area.style.setProperty('--reader-line-height', values.lineHeight);
            area.style.setProperty('--reader-letter-spacing', values.letterSpacing + 'px');
            area.style.setProperty('--reader-max-width', values.contentWidth + 'px');
            area.style.setProperty('--paragraph-gap', values.paragraphGap + 'em');

            get('setting-font-size-value').textContent = values.fontSize + ' px';
            get('setting-line-height-value').textContent = Number(values.lineHeight).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
            get('setting-letter-spacing-value').textContent = Number(values.letterSpacing).toFixed(1).replace(/\.0$/, '') + ' px';
            get('setting-content-width-value').textContent = values.contentWidth + ' px';
            get('setting-paragraph-gap-value').textContent = Number(values.paragraphGap).toFixed(1) + ' em';

            const bold = get('setting-strong-color');
            const italic = get('setting-em-color');
            if (bold.dataset.customized === 'true') area.style.setProperty('--strong-color', bold.value);
            else area.style.removeProperty('--strong-color');
            if (italic.dataset.customized === 'true') area.style.setProperty('--em-color', italic.value);
            else area.style.removeProperty('--em-color');

            if (save) {
                const saved = { ...values };
                if (bold.dataset.customized === 'true') saved.strongColor = bold.value;
                if (italic.dataset.customized === 'true') saved.emColor = italic.value;
                try { localStorage.setItem('nativeReaderSettings', JSON.stringify(saved)); } catch (_) {}
            }
        }

        function resetReaderSettings() {
            const map = {
                cjkFont: 'setting-cjk-font', latinFont: 'setting-latin-font', fontSize: 'setting-font-size',
                lineHeight: 'setting-line-height', letterSpacing: 'setting-letter-spacing',
                contentWidth: 'setting-content-width', paragraphGap: 'setting-paragraph-gap'
            };
            Object.entries(map).forEach(([key, id]) => { document.getElementById(id).value = defaultSettings[key]; });
            ['setting-strong-color', 'setting-em-color'].forEach((id) => {
                const el = document.getElementById(id); el.dataset.customized = 'false';
                el.value = id === 'setting-strong-color' ? '#bd5239' : '#2c719c';
            });
            try { localStorage.removeItem('nativeReaderSettings'); } catch (_) {}
            applyReaderSettings(false);
        }

        async function enhanceMarkdownContent(container) {
            await renderMermaidDiagrams(container);
            renderChartBlocks(container);
            await typesetMath(container);
        }

        async function renderMermaidDiagrams(container) {
            const codeBlocks = Array.from(container.querySelectorAll('pre > code.language-mermaid'));
            codeBlocks.forEach((code, index) => {
                const originalPre = code.parentElement;
                const wrapper = document.createElement('div');
                wrapper.className = 'diagram-wrap';
                wrapper.dataset.diagramType = 'mermaid';
                wrapper.dataset.mermaidSource = code.textContent;
                const pre = document.createElement('pre');
                pre.className = 'mermaid';
                pre.textContent = code.textContent;
                pre.id = 'mermaid-diagram-' + Date.now() + '-' + index;
                wrapper.appendChild(pre);
                originalPre.replaceWith(wrapper);
            });
            if (!window.mermaid) {
                container.querySelectorAll('.diagram-wrap[data-diagram-type="mermaid"]').forEach((wrapper) => {
                    const note = document.createElement('p'); note.className = 'diagram-error';
                    note.textContent = '图表引擎加载失败，请检查网络连接。下方保留了图表源码。';
                    wrapper.prepend(note);
                });
                return;
            }
            const dark = document.body.getAttribute('data-theme') === 'dark';
            window.mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'strict',
                theme: dark ? 'dark' : 'default',
                fontFamily: getComputedStyle(container).fontFamily,
                flowchart: { htmlLabels: false, useMaxWidth: true }
            });
            const blocks = Array.from(container.querySelectorAll('pre.mermaid'));
            for (const block of blocks) {
                const wrapper = block.closest('.diagram-wrap');
                const source = wrapper?.dataset.mermaidSource || block.textContent;
                try {
                    await window.mermaid.run({ nodes: [block] });
                } catch (error) {
                    console.warn('Mermaid 图表解析失败：', error);
                    if (wrapper) {
                        wrapper.innerHTML = '';
                        const note = document.createElement('p'); note.className = 'diagram-error';
                        note.textContent = '图表解析失败，请检查 Mermaid 语法。已显示原始代码。';
                        const fallback = document.createElement('pre'); fallback.className = 'mermaid-source-fallback';
                        fallback.textContent = source;
                        wrapper.append(note, fallback);
                    }
                }
            }
        }

        async function rerenderMermaidDiagrams(container) {
            const wrappers = Array.from(container.querySelectorAll('.diagram-wrap[data-diagram-type="mermaid"]'));
            wrappers.forEach((wrapper) => {
                const source = wrapper.dataset.mermaidSource || '';
                wrapper.innerHTML = '';
                const pre = document.createElement('pre'); pre.className = 'mermaid'; pre.textContent = source;
                wrapper.appendChild(pre);
            });
            if (wrappers.length) await renderMermaidDiagrams(container);
        }

        function renderChartBlocks(container) {
            const blocks = Array.from(container.querySelectorAll('pre > code.language-chart, pre > code.language-chartjs'));
            blocks.forEach((code) => {
                const pre = code.parentElement;
                const wrapper = document.createElement('div'); wrapper.className = 'chart-container';
                const canvas = document.createElement('canvas');
                canvas.setAttribute('role', 'img');
                canvas.setAttribute('aria-label', 'Markdown 图表');
                wrapper.appendChild(canvas);
                try {
                    const config = JSON.parse(code.textContent);
                    const allowedTypes = ['bar', 'line', 'pie', 'doughnut', 'polarArea', 'radar', 'scatter', 'bubble'];
                    if (!config || !allowedTypes.includes(config.type) || !config.data || !Array.isArray(config.data.datasets)) {
                        throw new Error('图表 JSON 需要包含受支持的 type 和 data.datasets。');
                    }
                    if (!window.Chart) throw new Error('Chart.js 加载失败，请检查网络连接。');
                    const safeConfig = {
                        type: config.type,
                        data: config.data,
                        options: { ...(config.options || {}), responsive: true, maintainAspectRatio: false }
                    };
                    const instance = new window.Chart(canvas.getContext('2d'), safeConfig);
                    chartInstances.push(instance);
                    pre.replaceWith(wrapper);
                } catch (error) {
                    console.warn('图表配置无法解析：', error);
                    const message = document.createElement('p'); message.className = 'diagram-error';
                    message.textContent = '数据图表无法显示：' + (error.message || '请检查 JSON 格式。');
                    pre.replaceWith(message, pre);
                }
            });
        }

        async function typesetMath(container) {
            if (!window.MathJax || !window.MathJax.typesetPromise) return;
            try {
                if (window.MathJax.typesetClear) window.MathJax.typesetClear([container]);
                await window.MathJax.typesetPromise([container]);
            } catch (error) {
                console.warn('公式排版失败：', error);
            }
        }

        function applyLanguageFonts(container) {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) {
                const node = walker.currentNode;
                const parent = node.parentElement;
                if (!parent || !/[\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/u.test(node.nodeValue || '')) continue;
                if (parent.closest('code, svg, script, style, textarea, .diagram-wrap, .chart-container, .MathJax, mjx-container') || parent.closest('pre:not(.plain-text)')) continue;
                textNodes.push(node);
            }
            const cjkPattern = /([\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]+)/gu;
            textNodes.forEach((node) => {
                const parts = node.nodeValue.split(cjkPattern);
                if (parts.length < 2) return;
                const fragment = document.createDocumentFragment();
                parts.forEach((part) => {
                    if (!part) return;
                    if (/[\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/u.test(part)) {
                        const span = document.createElement('span'); span.className = 'cjk-run'; span.textContent = part; fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.replaceWith(fragment);
            });
        }
    </script>
